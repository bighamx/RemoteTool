name: Web CI

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'WebApplication/**'
      - 'RemoteTool.Lib/**'
      - 'RemoteTool.Lib.Tests/**'
      - 'tools/PhoneTools/**'
      - 'tests/**'
      - 'packages/**'
      - 'RemoteTool.sln'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
      - '.github/workflows/dotnet-build.yml'
      - '.github/workflows/server-release.yml'
      - '.github/workflows/server-update-validation.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'WebApplication/**'
      - 'RemoteTool.Lib/**'
      - 'RemoteTool.Lib.Tests/**'
      - 'tools/PhoneTools/**'
      - 'tests/**'
      - 'packages/**'
      - 'RemoteTool.sln'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
      - '.github/workflows/dotnet-build.yml'
      - '.github/workflows/server-release.yml'
      - '.github/workflows/server-update-validation.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-validation:
    uses: ./.github/workflows/server-update-validation.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore RemoteTool.sln

    - name: Build
      run: dotnet build RemoteTool.sln --no-restore --configuration Release

    - name: Publish
      run: dotnet publish WebApplication/WebApplication.csproj --no-build --configuration Release --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: published-app
        path: ./publish
        if-no-files-found: error
        retention-days: 7

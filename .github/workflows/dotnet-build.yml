name: Web build and publish

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'WebApplication/**'
      - 'RemoteTool.Lib/**'
      - 'RemoteTool.Lib.Tests/**'
      - 'tools/PhoneTools/**'
      - 'tests/**'
      - 'packages/**'
      - 'RemoteTool.sln'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
      - '.github/workflows/dotnet-build.yml'
      - '.github/workflows/server-release.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'WebApplication/**'
      - 'RemoteTool.Lib/**'
      - 'RemoteTool.Lib.Tests/**'
      - 'tools/PhoneTools/**'
      - 'tests/**'
      - 'packages/**'
      - 'RemoteTool.sln'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
      - '.github/workflows/dotnet-build.yml'
      - '.github/workflows/server-release.yml'

permissions:
  contents: write

jobs:
  server-update-contracts:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - run: dotnet run --project tests/ServerUpdates/ServerUpdates.csproj
    - run: dotnet run --project tests/UpdaterBootstrap/UpdaterBootstrap.csproj
    - run: dotnet run --project tests/UpdaterReadiness/UpdaterReadiness.csproj
    - run: node tests/server_update_ui.test.cjs
    - run: dotnet publish WebApplication/WebApplication.csproj -c Release -p:UseAppHost=false -o artifacts/updater-smoke
    - shell: pwsh
      run: ./tests/test_server_updater_entry.ps1 -RuntimeDirectory artifacts/updater-smoke
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore RemoteTool.sln

    - name: Build
      run: dotnet build RemoteTool.sln --no-restore --configuration Release

    - name: Publish
      run: dotnet publish WebApplication/WebApplication.csproj --no-build --configuration Release --output ./publish

    - name: Zip published app
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd publish
        zip -r ../RemoteTool.zip .
        cd ..

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: RemoteTool.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: published-app
        path: ./publish
  linux-update-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/ServerUpdates/ServerUpdates.csproj
      - run: dotnet run --project tests/UpdaterBootstrap/UpdaterBootstrap.csproj
      - run: dotnet run --project tests/UpdaterReadiness/UpdaterReadiness.csproj
      - run: dotnet publish WebApplication/WebApplication.csproj -c Release -p:UseAppHost=false -o artifacts/linux-entry
      - run: bash tests/test_updater_entry_linux.sh artifacts/linux-entry
      - name: Real systemd update and rollback
        shell: bash
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          bash tests/test_updater_systemd.sh

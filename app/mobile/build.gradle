plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// First-parent history is monotonic on the publishing branch. Stable tags use
// the next slot for the same commit; later development commits advance again.
def gitOutput = { List<String> args ->
    def out = new ByteArrayOutputStream()
    def result = project.exec {
        workingDir rootProject.projectDir
        commandLine(['git'] + args)
        standardOutput = out
        errorOutput = new ByteArrayOutputStream()
        ignoreExitValue = true
    }
    result.exitValue == 0 ? out.toString('UTF-8').trim() : ''
}
def sourceHash = gitOutput(['rev-parse', '--short=12', 'HEAD'])
def sourceCount = gitOutput(['rev-list', '--first-parent', '--count', 'HEAD'])
def versioning = new groovy.json.JsonSlurper().parse(rootProject.file('versioning.json'))
def buildChannel = providers.gradleProperty('buildChannel').orElse('development').get()
def automaticBuildCode = sourceCount.isInteger() ? versioning.versionCodeBase.toInteger() + sourceCount.toInteger() * 2 + (buildChannel == 'stable' ? 1 : 0) : 149
def appBuildCode = providers.gradleProperty('buildVersionCode').map { it.toInteger() }.orElse(automaticBuildCode).get()
def appVersionName = { String base -> buildChannel == 'stable' ? base : "${base}-dev.${sourceHash ?: 'unknown'}" }

android {
    namespace 'com.chuckiehelper.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chuckiehelper.mobile'
        minSdk 26
        targetSdk 34
        buildConfigField 'boolean', 'CLOUD_QR_LOGIN_ENABLED', providers.gradleProperty('cloudQrLoginEnabled').orElse('true').get().toBoolean().toString()
        buildConfigField 'boolean', 'CLOUD_QR_APPROVAL_ENABLED', providers.gradleProperty('cloudQrApprovalEnabled').orElse('true').get().toBoolean().toString()
    }
    flavorDimensions += 'edition'
    productFlavors {
        full {
            dimension 'edition'
            applicationId 'com.chuckiehelper.mobile'
            versionCode appBuildCode
            versionName appVersionName(versioning.fullVersionName)
            buildConfigField 'boolean', 'PHONE_COMPANION', 'false'
            manifestPlaceholders = [appLabel: 'RemoteTool', appIcon: '@mipmap/ic_launcher',
                siblingPackage: 'com.chuckiehelper.phonecontrol', accessibilityLabel: 'RemoteTool 手机操控', notificationLabel: 'RemoteTool 手机通知',
                xiaomiAppId: providers.gradleProperty('mobileXiaomiAppId').orElse('').get(),
                xiaomiDebug: providers.gradleProperty('mobileXiaomiDebug').orElse('false').get()]
        }
        phone {
            dimension 'edition'
            applicationId 'com.chuckiehelper.phonecontrol'
            versionCode appBuildCode
            versionName appVersionName(versioning.phoneVersionName)
            buildConfigField 'boolean', 'PHONE_COMPANION', 'true'
            manifestPlaceholders = [appLabel: '手机操控', appIcon: '@drawable/ic_phone_control',
                siblingPackage: 'com.chuckiehelper.mobile', accessibilityLabel: '手机操控 · 无障碍', notificationLabel: '手机操控 · 通知读取',
                xiaomiAppId: providers.gradleProperty('phonecontrolXiaomiAppId').orElse('').get(),
                xiaomiDebug: providers.gradleProperty('phonecontrolXiaomiDebug').orElse('false').get()]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true; aidl true }
    // Existing installations use this original certificate; never replace it with a new SDK debug key.
    def updateStorePath = providers.gradleProperty('remoteToolSigningStore')
        .orElse(providers.environmentVariable('REMOTE_TOOL_SIGNING_STORE')).orNull
    def projectUpdateStore = rootProject.file('signing/RemoteTool-release-signing-debug.keystore')
    def updateStore = updateStorePath ? file(updateStorePath) : (projectUpdateStore.isFile() ? projectUpdateStore : new File(System.getProperty('user.home'), '.android/debug-hermes.keystore'))
    if (updateStorePath && !updateStore.isFile()) throw new GradleException('RemoteTool signing store does not exist')
    if (updateStore.isFile()) {
        signingConfigs.debug.storeFile = updateStore
        signingConfigs.debug.storePassword = providers.environmentVariable('REMOTE_TOOL_SIGNING_STORE_PASSWORD').orElse('android').get()
        signingConfigs.debug.keyAlias = providers.environmentVariable('REMOTE_TOOL_SIGNING_KEY_ALIAS').orElse('androiddebugkey').get()
        signingConfigs.debug.keyPassword = providers.environmentVariable('REMOTE_TOOL_SIGNING_KEY_PASSWORD').orElse('android').get()
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // Local/Robolectric tests must never send production usage statistics.
        unitTests.all { systemProperty 'remotetool.telemetry.disabled', 'true' }
    }
    // Deliverable naming follows the project name (RemoteTool), not the legacy package.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def prefix = variant.flavorName == 'phone' ? 'RemoteTool-PhoneControl' : 'RemoteTool'
            outputFileName = "${prefix}-${variant.versionName}-${variant.versionCode}.apk"
        }
        if (variant.buildType.name == 'release') {
            def prefix = variant.flavorName == 'phone' ? 'RemoteTool-PhoneControl' : 'RemoteTool'
            def archive = tasks.register("archive${variant.name.capitalize()}CrashMapping", Zip) {
                inputs.property('apkVersionName', variant.versionName)
                inputs.property('apkVersionCode', variant.versionCode)
                from(layout.buildDirectory.file("outputs/mapping/${variant.name}/mapping.txt")) {
                    rename { "${prefix}-${variant.versionName}-${variant.versionCode}-mapping.txt" }
                }
                destinationDirectory = layout.buildDirectory.dir('outputs/crash-mappings')
                archiveFileName = "${prefix}-mapping.zip"
            }
            variant.assembleProvider.configure { finalizedBy(archive) }
        }
        def prune = tasks.register("prune${variant.name.capitalize()}OldApks") {
            doLast {
                def currentNames = variant.outputs.collect { it.outputFileName }.toSet()
                def directory = layout.buildDirectory.dir("outputs/apk/${variant.flavorName}/${variant.buildType.name}").get().asFile
                if (currentNames.every { new File(directory, it).isFile() }) {
                    fileTree(directory) { include 'RemoteTool-*.apk' }.files.findAll { !currentNames.contains(it.name) }.each { it.delete() }
                }
            }
        }
        variant.assembleProvider.configure { finalizedBy(prune) }
    }

    buildTypes {
        release {
            // Preserve the certificate used by installed APKs so updates keep app data.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

apply from: rootProject.file('shared-dependencies.gradle')

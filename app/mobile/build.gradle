plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.chuckiehelper.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chuckiehelper.mobile'
        minSdk 26
        targetSdk 34
        buildConfigField 'boolean', 'CLOUD_QR_LOGIN_ENABLED', providers.gradleProperty('cloudQrLoginEnabled').orElse('true').get().toBoolean().toString()
        buildConfigField 'boolean', 'CLOUD_QR_APPROVAL_ENABLED', providers.gradleProperty('cloudQrApprovalEnabled').orElse('true').get().toBoolean().toString()
    }
    flavorDimensions += 'edition'
    productFlavors {
        full {
            dimension 'edition'
            applicationId 'com.chuckiehelper.mobile'
            versionCode 107
            versionName '0.3.104'
            buildConfigField 'boolean', 'PHONE_COMPANION', 'false'
            manifestPlaceholders = [appLabel: 'RemoteTool', appIcon: '@mipmap/ic_launcher',
                siblingPackage: 'com.chuckiehelper.phonecontrol', accessibilityLabel: 'RemoteTool 手机操控', notificationLabel: 'RemoteTool 手机通知',
                xiaomiAppId: providers.gradleProperty('mobileXiaomiAppId').orElse('').get(),
                xiaomiDebug: providers.gradleProperty('mobileXiaomiDebug').orElse('false').get()]
        }
        phone {
            dimension 'edition'
            applicationId 'com.chuckiehelper.phonecontrol'
            versionCode 17
            versionName '0.2.15'
            buildConfigField 'boolean', 'PHONE_COMPANION', 'true'
            manifestPlaceholders = [appLabel: '手机操控', appIcon: '@drawable/ic_phone_control',
                siblingPackage: 'com.chuckiehelper.mobile', accessibilityLabel: '手机操控 · 无障碍', notificationLabel: '手机操控 · 通知读取',
                xiaomiAppId: providers.gradleProperty('phonecontrolXiaomiAppId').orElse('').get(),
                xiaomiDebug: providers.gradleProperty('phonecontrolXiaomiDebug').orElse('false').get()]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true; aidl true }
    // Existing installations use this original certificate; never replace it with a new SDK debug key.
    def updateStorePath = providers.gradleProperty('remoteToolSigningStore')
        .orElse(providers.environmentVariable('REMOTE_TOOL_SIGNING_STORE')).orNull
    def projectUpdateStore = rootProject.file('signing/RemoteTool-release-signing-debug.keystore')
    def updateStore = updateStorePath ? file(updateStorePath) : (projectUpdateStore.isFile() ? projectUpdateStore : new File(System.getProperty('user.home'), '.android/debug-hermes.keystore'))
    if (updateStorePath && !updateStore.isFile()) throw new GradleException('RemoteTool signing store does not exist')
    if (updateStore.isFile()) signingConfigs.debug.storeFile = updateStore
    testOptions { unitTests.includeAndroidResources = true }
    // Deliverable naming follows the project name (RemoteTool), not the legacy package.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def prefix = variant.flavorName == 'phone' ? 'RemoteTool-PhoneControl' : 'RemoteTool'
            outputFileName = "${prefix}-${variant.versionName}-${variant.versionCode}.apk"
        }
        if (variant.buildType.name == 'release') {
            def prefix = variant.flavorName == 'phone' ? 'RemoteTool-PhoneControl' : 'RemoteTool'
            def archive = tasks.register("archive${variant.name.capitalize()}CrashMapping", Copy) {
                inputs.property('apkVersionName', variant.versionName)
                inputs.property('apkVersionCode', variant.versionCode)
                from layout.buildDirectory.file("outputs/mapping/${variant.name}/mapping.txt")
                into layout.buildDirectory.dir('outputs/crash-mappings')
                rename { "${prefix}-${variant.versionName}-${variant.versionCode}-mapping.txt" }
            }
            variant.assembleProvider.configure { finalizedBy(archive) }
        }
    }

    buildTypes {
        release {
            // Preserve the certificate used by installed APKs so updates keep app data.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

apply from: rootProject.file('shared-dependencies.gradle')

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.chuckiehelper.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chuckiehelper.mobile'
        minSdk 26
        targetSdk 34
        versionCode 71
        versionName "0.3.68"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    // Existing installations use this original certificate; never replace it with a new SDK debug key.
    def updateStorePath = providers.gradleProperty('remoteToolSigningStore')
        .orElse(providers.environmentVariable('REMOTE_TOOL_SIGNING_STORE')).orNull
    def projectUpdateStore = rootProject.file('signing/RemoteTool-release-signing-debug.keystore')
    def updateStore = updateStorePath ? file(updateStorePath) : (projectUpdateStore.isFile() ? projectUpdateStore : new File(System.getProperty('user.home'), '.android/debug-hermes.keystore'))
    if (updateStorePath && !updateStore.isFile()) throw new GradleException('RemoteTool signing store does not exist')
    if (updateStore.isFile()) signingConfigs.debug.storeFile = updateStore
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        release {
            // Preserve the certificate used by installed APKs so updates keep app data.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation('org.robolectric:robolectric:4.14.1') {
        // These tests exercise Android text/scroll behaviour with legacy graphics.
        exclude group: 'org.robolectric', module: 'nativeruntime-dist-compat'
    }
    testImplementation 'org.json:json:20240303'
}

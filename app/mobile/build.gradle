plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.chuckiehelper.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chuckiehelper.mobile'
        minSdk 26
        targetSdk 34
        versionCode 91
        versionName "0.3.88"
        buildConfigField 'boolean', 'PHONE_COMPANION', 'false'
        manifestPlaceholders.xiaomiAppId = providers.gradleProperty('mobileXiaomiAppId').orElse('').get()
        manifestPlaceholders.xiaomiDebug = providers.gradleProperty('mobileXiaomiDebug').orElse('false').get()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true; aidl true }
    sourceSets.main.java.srcDir '../phone-shared/src/main/java'
    // Existing installations use this original certificate; never replace it with a new SDK debug key.
    def updateStorePath = providers.gradleProperty('remoteToolSigningStore')
        .orElse(providers.environmentVariable('REMOTE_TOOL_SIGNING_STORE')).orNull
    def projectUpdateStore = rootProject.file('signing/RemoteTool-release-signing-debug.keystore')
    def updateStore = updateStorePath ? file(updateStorePath) : (projectUpdateStore.isFile() ? projectUpdateStore : new File(System.getProperty('user.home'), '.android/debug-hermes.keystore'))
    if (updateStorePath && !updateStore.isFile()) throw new GradleException('RemoteTool signing store does not exist')
    if (updateStore.isFile()) signingConfigs.debug.storeFile = updateStore
    testOptions { unitTests.includeAndroidResources = true }
    // Deliverable naming follows the project name (RemoteTool), not the legacy package.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "RemoteTool-${variant.versionName}-${variant.versionCode}.apk"
        }
    }

    buildTypes {
        release {
            // Preserve the certificate used by installed APKs so updates keep app data.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

apply from: rootProject.file('shared-dependencies.gradle')

// Retain a versioned mapping beside build outputs for diagnosing obfuscated release stacks.
tasks.register('archiveReleaseCrashMapping', Copy) {
    from layout.buildDirectory.file('outputs/mapping/release/mapping.txt')
    into layout.buildDirectory.dir('outputs/crash-mappings')
    rename { "RemoteTool-${android.defaultConfig.versionName}-${android.defaultConfig.versionCode}-mapping.txt" }
}
tasks.configureEach {
    if (name == 'assembleRelease') finalizedBy('archiveReleaseCrashMapping')
}

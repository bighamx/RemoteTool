plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.chuckiehelper.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.chuckiehelper.phonecontrol'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2.1'
        buildConfigField 'boolean', 'PHONE_COMPANION', 'true'
        manifestPlaceholders.xiaomiAppId = providers.gradleProperty('phonecontrolXiaomiAppId').orElse('').get()
        manifestPlaceholders.xiaomiDebug = providers.gradleProperty('phonecontrolXiaomiDebug').orElse('false').get()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true; aidl true }
    // The lightweight shell uses the same screens, account and forwarding implementations.
    sourceSets {
        main {
            java.srcDirs = ['../mobile/src/main/java', '../phone-shared/src/main/java']
            aidl.srcDirs = ['../mobile/src/main/aidl']
            res.srcDirs = ['src/main/res', '../mobile/src/main/res']
        }
    }
    def storePath = providers.gradleProperty('remoteToolSigningStore')
        .orElse(providers.environmentVariable('REMOTE_TOOL_SIGNING_STORE')).orNull
    def projectStore = rootProject.file('signing/RemoteTool-release-signing-debug.keystore')
    def store = storePath ? file(storePath) : (projectStore.isFile() ? projectStore : new File(System.getProperty('user.home'), '.android/debug-hermes.keystore'))
    if (storePath && !store.isFile()) throw new GradleException('Phone control signing store does not exist')
    if (store.isFile()) signingConfigs.debug.storeFile = store
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), rootProject.file('mobile/proguard-rules.pro')
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output -> outputFileName = "RemoteTool-PhoneControl-${variant.versionName}-${variant.versionCode}.apk" }
    }
}

apply from: rootProject.file('shared-dependencies.gradle')

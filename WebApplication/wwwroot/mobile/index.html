<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RemoteTool"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><title>RemoteTool</title><link rel="stylesheet" href="mobile.css?v=2"></head>
<body>
<section id="login" class="login" hidden><form id="login-form" class="card"><img class="login-icon" src="icon.svg" alt="" width="72" height="72"><div class="eyebrow">REMOTETOOL</div><h1>连接你的电脑</h1><p>使用电脑服务端配置的账号登录。</p><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><p id="login-error" role="alert"></p></form></section>
<div id="app" hidden>
<header class="app-bar"><div class="brand"><img src="icon.svg" alt="" width="36" height="36"><div><div class="eyebrow">REMOTETOOL</div><strong id="host">手机控制台</strong></div></div><div class="header-actions"><button id="install-app" class="icon-button" type="button" hidden aria-label="安装应用" title="安装应用">＋</button><button id="logout" class="icon-button logout-button" type="button" aria-label="退出登录" title="退出登录">退出</button></div></header>
<p id="notice" class="notice" role="status" hidden></p>
<p id="install-tip" class="notice" role="status" hidden></p>
<main>
<section id="system-page"><div class="section-head"><div><span class="overline">这台设备</span><h1>系统</h1></div><button id="refresh-system" class="quiet small-button">刷新</button></div><div class="card device-card"><div class="device-status"><span class="status-dot"></span>已连接到这台 Mac</div><div id="metrics" class="metrics"></div></div><div class="card"><h2>设备能力</h2><pre id="platform-info"></pre><p>Mac 锁屏时桌面画面和键鼠控制不可用。</p></div><details class="card power-panel"><summary>电源与锁屏操作</summary><div class="actions"><button data-power="lock" class="quiet">锁定</button><button data-power="sleep" class="quiet">睡眠</button><button data-power="reboot" class="danger">重启</button><button data-power="shutdown" class="danger">关机</button></div><p>重启和关机需要电脑上的系统权限。</p></details><a class="tool-link card" href="/remote/index"><span>更多电脑工具</span><span aria-hidden="true">↗</span></a></section>
<section id="codex-page" hidden><div class="section-head codex-list-head"><div><span class="overline">在这台 Mac 上运行</span><h1>Codex</h1></div><button id="refresh-sessions" class="quiet small-button">刷新</button></div>
<div class="chat-grid"><aside class="card session-panel"><input id="session-search" placeholder="搜索会话" aria-label="搜索会话"><div id="sessions"></div><button id="more-sessions" class="quiet" hidden>加载更多</button><details class="new-session"><summary>＋ 新建会话</summary><form id="new-session"><label>标题<input id="new-title" placeholder="手机 Codex 对话"></label><label>已有项目<select id="project"><option value="">无项目（独立工作目录）</option></select></label><button type="submit">创建</button></form></details></aside>
<article class="card conversation"><div class="section-head conversation-bar"><button id="back-sessions" class="back-button" type="button" aria-label="返回会话列表">←</button><div class="conversation-title"><h2 id="chat-title">选择一个会话</h2><small id="chat-path"></small></div><button id="rename-session" class="quiet small-button" disabled>改名</button></div><div id="messages" aria-live="polite"></div><div id="run-output" hidden><small id="run-state"></small><pre id="live-text"></pre><p id="tool-state"></p></div><div id="approval" class="approval" hidden></div><div class="actions"><button id="stop-run" class="danger" hidden>停止任务</button><button id="verify-run" class="quiet" hidden>核对提交结果</button><button id="dismiss-pending" class="quiet" hidden>确认未执行，恢复草稿</button></div>
<form id="composer"><label class="sr-only" for="prompt">消息</label><textarea id="prompt" rows="2" placeholder="给 Codex 发送消息…" disabled required></textarea><div class="actions composer-actions"><small id="send-hint">任务在电脑上继续运行</small><button id="send" type="submit" disabled>发送</button></div></form></article></div></section>
<section id="desktop-page" hidden><div class="section-head"><h1>远程桌面</h1><div class="actions"><button id="connect-desktop">连接</button><button id="disconnect-desktop" class="quiet" disabled>断开</button></div></div><p id="desktop-note">第一版手机网页使用 JPEG 帧，支持主屏幕触摸、拖拽、滚轮和文字输入。Windows 高帧率视频可从“更多工具”进入。</p><div class="desktop-frame"><img id="screen" alt="连接后显示电脑桌面" tabindex="0" draggable="false"></div><div class="actions"><button id="right-click" class="quiet">右键模式：关</button><button data-shortcut="Enter" class="quiet">Enter</button><button data-shortcut="Escape" class="quiet">Esc</button><button data-shortcut="Backspace" class="quiet">退格</button><button id="scroll-up" class="quiet">向上滚动</button><button id="scroll-down" class="quiet">向下滚动</button></div><form id="desktop-text"><label>发送文字<textarea id="remote-text" maxlength="2048" placeholder="中文通过手机输入法输入后发送"></textarea></label><button>发送到电脑</button></form></section>
<section id="terminal-page" hidden><div class="section-head"><h1>命令终端</h1><div class="actions"><button id="connect-terminal">连接</button><button id="disconnect-terminal" class="quiet" disabled>断开</button></div></div><p>按行输入命令；连接以服务运行账户身份执行。关闭连接会结束该 Shell。</p><pre id="terminal-output" tabindex="0"></pre><form id="terminal-form"><label>命令<input id="command" autocomplete="off" spellcheck="false" disabled></label><button id="terminal-send" disabled>执行</button></form></section>
</main><nav class="bottom-nav" aria-label="控制台页面"><button data-page="system" class="selected"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4l2-7 4 12 2-5h6"/></svg><span>系统</span></button><button data-page="desktop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8m-4-3v3"/></svg><span>远程</span></button><button data-page="codex"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-3 16"/></svg><span>Codex</span></button><button data-page="terminal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m5 0h5"/></svg><span>终端</span></button></nav></div><script type="module" src="mobile.js?v=4"></script></body></html>
